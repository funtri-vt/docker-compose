services:
  firefox:
    image: lscr.io/linuxserver/firefox:latest
    runtime: kata
    container_name: firefox
    network_mode: bridge
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - ./config:/config
    ports:
      - "3000:3000"
      - "3001:3001"
    shm_size: "4gb"
    restart: unless-stopped
